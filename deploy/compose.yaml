name: llm-gateway
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.gateway
  environment:
    DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?Set GATEWAY_ENCRYPTION_KEY in .env}
    GATEWAY_LISTEN: 0.0.0.0:8080
    GATEWAY_WEB_URL: http://web:3000
    GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  volumes:
    - ../configs/example.yaml:/app/configs/example.yaml:ro
    - archives:/app/.data/archives
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  archive-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown 65532:65532 /archives && chmod 700 /archives"]
    volumes:
      - archives:/archives
  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      archive-init:
        condition: service_completed_successfully
    entrypoint: ["/app/migrate"]
    command: ["-config", "/app/configs/example.yaml"]
  gateway:
    <<: *backend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker:
    <<: *backend
    entrypoint: ["/app/worker"]
    command: ["-config", "/app/configs/example.yaml"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
volumes:
  postgres:
  redis:
  archives:
